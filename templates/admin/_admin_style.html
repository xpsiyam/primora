<style>
  * { box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; margin: 0; padding: 0; }
  body { background: #F1F5F9; color: #1E293B; }
  .admin-navbar { background: #091A2F; color: #FFF; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #F5A623; }
  .admin-brand { font-size: 18px; font-weight: 800; }
  .admin-link-btn { background: rgba(255,255,255,0.1); color: #FFF; padding: 6px 14px; border-radius: 6px; font-size: 13px; text-decoration: none; }
  .admin-link-btn:hover { background: rgba(255,255,255,0.2); }
  .wrap { max-width: 760px; margin: 25px auto 60px; padding: 0 16px; }
  .card { background: #FFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 20px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .card h2 { font-size: 17px; color: #0F294A; margin-bottom: 6px; }
  .hint { font-size: 12.5px; color: #64748B; line-height: 1.7; margin-bottom: 12px; }
  .hint b { color: #0F294A; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
  input[type=text], input[type=email], input[type=password] { width: 100%; padding: 11px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 14px; outline: none; }
  input:focus { border-color: #F5A623; box-shadow: 0 0 0 3px rgba(245,166,35,.2); }
  .row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .row input { flex: 1 1 200px; }
  .btn { background: #0F294A; color: #FFF; border: none; padding: 11px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-gold { background: #F5A623; color: #091A2F; }
  .btn-violet { background: #7C3AED; }
  .btn-light { background: #E2E8F0; color: #0F294A; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-left: 6px; }
  .pill-ok { background: #D1FAE5; color: #065F46; }
  .pill-no { background: #FEE2E2; color: #991B1B; }
  .msg { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; }
  .msg-ok { background: #D1FAE5; color: #065F46; border: 1px solid #6EE7B7; }
  .msg-err { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
  .chatbox { margin-top: 10px; font-size: 13px; }
  .chatitem { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 8px 12px; margin-top: 6px; }
  .check { font-size: 12.5px; color: #64748B; font-weight: 400; display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .check input { width: auto; }
</style>
