<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>পাসওয়ার্ড পরিবর্তন — PRIMORA KIT</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  {% include "admin/_admin_style.html" %}
</head>
<body>
  <header class="admin-navbar">
    <div class="admin-brand">🔑 পাসওয়ার্ড পরিবর্তন</div>
    <a href="{{ url_for('admin_dashboard') }}" class="admin-link-btn">← ড্যাশবোর্ডে ফিরুন</a>
  </header>

  <div class="wrap" style="max-width:520px;">
    {% if msg %}<div class="msg msg-{{ msg[0] }}">{{ msg[1] }}</div>{% endif %}
    <form method="POST" class="card" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <h2>অ্যাডমিন পাসওয়ার্ড বদলান</h2>
      <p class="hint">নতুন পাসওয়ার্ড কমপক্ষে ১০ অক্ষরের হতে হবে। অক্ষর, সংখ্যা ও চিহ্ন মিলিয়ে দিলে ভালো। এটি কাউকে বলবেন না।</p>
      <label>বর্তমান পাসওয়ার্ড</label>
      <input type="password" name="current" required autocomplete="current-password">
      <label>নতুন পাসওয়ার্ড</label>
      <input type="password" name="new" required minlength="10" autocomplete="new-password">
      <label>নতুন পাসওয়ার্ড আবার লিখুন</label>
      <input type="password" name="new2" required minlength="10" autocomplete="new-password">
      <div style="margin-top:18px;"><button type="submit" class="btn btn-gold">🔑 পাসওয়ার্ড বদলান</button></div>
    </form>
  </div>
</body>
</html>
